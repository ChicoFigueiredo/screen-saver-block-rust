name: Validate PR and publish release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar a próxima versão de patch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    name: Verify PR (${{ matrix.name }})
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate build
        run: cargo check --locked

  prepare-release:
    name: Increment patch and create tag
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Increment the patch version
        id: version
        shell: bash
        run: |
          current=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"

          while git rev-parse -q --verify "refs/tags/v${next}" >/dev/null || \
            git ls-remote --exit-code --tags origin "refs/tags/v${next}" >/dev/null 2>&1; do
            patch=$((patch + 1))
            next="${major}.${minor}.$((patch + 1))"
          done

          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"${next}\"/" Cargo.toml
          cargo check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release: v${next}"
          git tag -a "v${next}" -m "Release v${next}"
          git push origin HEAD:main "v${next}"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build release (${{ matrix.name }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: block-screen-saver
            asset: block-screen-saver-linux-x86_64
          - name: windows-x86_64
            os: windows-latest
            binary: block-screen-saver.exe
            asset: block-screen-saver-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        run: cp target/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: "*-x86_64"
          path: dist
          merge-multiple: true

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          generate_release_notes: true
          files: dist/*
